# Keep the existing GitHub Pages main/root build.
# public-files.json is the reviewed website output; tests check exact build membership.
url: "https://macrothought.org"
baseurl: ""
title: "Macrothought"
description: "A field guide to knowledge, agent work, and the evidence behind it."
timezone: UTC
markdown: kramdown
highlighter: rouge
permalink: /devlog/:title/
collections:
  guides:
    output: true
    permalink: /docs/:name/
defaults:
  - scope: {path: "", type: guides}
    values: {layout: guide, section: docs}
  - scope: {path: "", type: posts}
    values: {layout: post, section: devlog}
exclude:
  - "README.md"
  - "public-files.json"
  - "plugins"
  - "scripts"
  - "tests"
  - "Gemfile"
  - "Gemfile.lock"
  - "node_modules"
  - "vendor"
  - ".sass-cache"
  - ".jekyll-cache"
  - "assets/brain-map-tree.jpg"
  - "assets/client-workspace.jpg"
  - "assets/file-map-wide.jpg"
  - "assets/hero-sky.jpg"
  - "assets/hub-remote.jpg"
  - "assets/intro-last.jpg"
  - "assets/intro-poster.jpg"
  - "assets/intro.mp4"
  - "assets/machine-3d.jpg"
  - "assets/showcase.mp4"
  - "assets/stats-dashboard.jpg"
  - "assets/tree-3d-focus.jpg"

{% assign media = site.data.media[include.id] %}{% if media and media.review_status == 'reviewed-public-history' %}
<figure class="media-figure{% if include.hero %} hero-media{% endif %}" data-media-id="{{ include.id }}">
{% if media.type == 'video' %}<video controls playsinline preload="none" poster="{{ media.poster | relative_url }}" width="{{ media.width }}" height="{{ media.height }}" aria-label="{{ media.title | escape }}" aria-describedby="caption-{{ include.id }}"><source src="{{ media.src | relative_url }}" type="video/mp4"><p>Your browser cannot play this recording. <a href="{{ media.src | relative_url }}">Open the video</a>.</p></video>
{% else %}<img src="{{ media.src | relative_url }}" alt="{{ media.alt | escape }}" width="{{ media.width }}" height="{{ media.height }}"{% if include.hero %} fetchpriority="high"{% else %} loading="lazy" decoding="async"{% endif %}>{% endif %}
<figcaption id="caption-{{ include.id }}"><span class="media-date">{{ media.captured }} / Consulate archive</span>{{ media.caption }} <a href="{{ media.source_url }}">Capture provenance →</a></figcaption>
{% if media.type == 'image' %}<details class="media-detail"><summary>Inspect full image</summary><div class="media-zoom" tabindex="0" role="region" aria-label="Full-size {{ media.title | escape }}"><img src="{{ media.src | relative_url }}" width="{{ media.width }}" height="{{ media.height }}" alt="{{ media.alt | escape }}" loading="lazy"></div></details>{% else %}<details class="video-description"><summary>Read the recording description</summary><p>{{ media.transcript }}</p></details>{% endif %}
</figure>{% endif %}

<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f6f5f0">
<title>{{ page.title | escape }} — Macrothought</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}"><meta property="og:site_name" content="Macrothought">
<meta property="og:title" content="{{ page.title | escape }}"><meta property="og:description" content="{{ page.description | default: site.description | escape }}"><meta property="og:url" content="{{ page.url | absolute_url }}"><meta property="og:image" content="{{ '/assets/sphere-3d-poster.jpg' | absolute_url }}"><meta property="og:image:width" content="1300"><meta property="og:image:height" content="918"><meta property="og:image:alt" content="A sphere of linked points from the July 2026 Consulate map archive."><meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml"><link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}"><link rel="alternate" type="application/rss+xml" title="Macrothought journal" href="{{ '/feed.xml' | relative_url }}"><script defer src="{{ '/assets/site.js' | relative_url }}"></script>
</head><body class="section-{{ page.section | default: 'home' }}"><a class="skip" href="#main">Skip to content</a>{% include header.html %}{{ content }}{% include footer.html %}</body></html>
